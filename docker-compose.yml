name: socialy-escrow

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: socialy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-socialydb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-socialydb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - socialy-network

  # ----------------------------------------------------------------------------
  # 2. Redis Caching & Rate Limiting Service
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: socialy-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - socialy-network

  # ----------------------------------------------------------------------------
  # 3. Socialy Backend API Service
  # ----------------------------------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: socialy-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgrespassword@postgres:5432/socialydb?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      ADMIN_CLERK_USER_ID: ${ADMIN_CLERK_USER_ID}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      IMAGEKIT_PUBLIC_KEY: ${IMAGEKIT_PUBLIC_KEY}
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY}
      IMAGEKIT_URL_ENDPOINT: ${IMAGEKIT_URL_ENDPOINT}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - socialy-network

  # ----------------------------------------------------------------------------
  # 4. Socialy Frontend Client (Nginx)
  # ----------------------------------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
        VITE_BASE_URL: ${VITE_BASE_URL:-http://localhost:3000}
        VITE_CURRENCY: ${VITE_CURRENCY:-₹}
    container_name: socialy-client
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - server
    networks:
      - socialy-network

  # ----------------------------------------------------------------------------
  # 5. Inngest Dev / Workflow Runner (Local/Staging Orchestration)
  # ----------------------------------------------------------------------------
  inngest:
    image: inngest/inngest:latest
    container_name: socialy-inngest
    restart: unless-stopped
    command: ["inngest", "dev", "-u", "http://server:3000/api/inngest/"]
    ports:
      - "8288:8288"
    depends_on:
      - server
    networks:
      - socialy-network

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ------------------------------------------------------------------------------
# Isolated Bridge Network
# ------------------------------------------------------------------------------
networks:
  socialy-network:
    driver: bridge
